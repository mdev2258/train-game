<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Right Time Railway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-thumb phone app. Sticky control strip on top, dot-matrix station board as the hero, cards below, tab bar pinned to the bottom. Deliberately dark: a station concourse at night. */
:root{
  color-scheme: dark;
  --bg:#0e1217;          /* concourse */
  --panel:#161b22;       /* card */
  --panel-2:#1d242d;     /* raised */
  --line:#29323d;        /* hairline */
  --ink:#e9edf2;         /* text */
  --mute:#8d99a8;        /* secondary text */
  --amber:#ffb22e;       /* dot-matrix LED */
  --amber-dim:#5a3f0c;
  --board:#060606;
  --good:#47c486;
  --bad:#ff5d55;
  --warn:#f0c64a;
  --dc:#c99bff;          /* third rail */
  --ac:#5fb0ff;          /* 25 kV overhead */
  --diesel:#d9a46c;      /* diesel */
  --sea:#0a1119;         /* map sea */
  --land:#1c2430;
  --land-far:#131920;
  --coast:#2e3b4a;
  --f-board:'Doto', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --f-label:'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom, 0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-label);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:14px 8px}

/* top strip */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg);max-width:640px;margin:0 auto;padding-block:10px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.opname{display:flex;align-items:baseline;gap:8px;min-width:0;font-family:var(--f-label)}
.opname b{font-size:18px;letter-spacing:.02em}
.opname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.chip-dot{width:10px;height:10px;border-radius:2px;flex:none;align-self:center}
.cash{font-family:var(--f-label);font-size:26px;font-weight:700;line-height:1}
.cash small{font-size:14px;font-weight:600;margin-left:6px}
.date{font-family:var(--f-label);font-size:13px;color:var(--mute);letter-spacing:.03em}
.speed{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex:none}
.speed button{min-width:40px;height:32px;border-radius:7px;font-family:var(--f-label);font-weight:700;font-size:14px;color:var(--mute)}
.speed button.on{background:var(--amber);color:#1a1205}
.dayprog{height:3px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.dayprog i{display:block;height:100%;width:0;background:var(--amber)}
.grade{font-family:var(--f-board);font-weight:900;font-size:22px;color:var(--amber);line-height:1;padding:4px 8px;border:1px solid var(--amber-dim);border-radius:6px;background:var(--board)}
.grade-wrap{display:flex;align-items:center;gap:8px;flex:none}
.grade-wrap .warns{display:flex;gap:3px}
.warns i{width:8px;height:8px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line)}
.warns i.on{background:var(--bad);border-color:var(--bad)}

/* station board */
.board{background:var(--board);border-radius:10px;border:1px solid #222;padding:12px 12px 10px;position:relative;overflow:hidden;
  background-image:radial-gradient(rgba(255,178,46,.06) 1px, transparent 1.2px);background-size:4px 4px}
.board, .board *{font-family:var(--f-board);color:var(--amber);text-shadow:0 0 6px rgba(255,178,46,.35)}
.board-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:15px;letter-spacing:.04em;border-bottom:1px dashed var(--amber-dim);padding-bottom:6px;margin-bottom:6px;gap:8px}
.board-head span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow{display:grid;grid-template-columns:48px minmax(0,1fr) 24px 84px;gap:6px;font-weight:700;font-size:14px;line-height:1.55}
.brow > *{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .st{text-align:right}
.brow.empty{display:block;opacity:.8}
.calling{margin-top:6px;border-top:1px dashed var(--amber-dim);padding-top:6px;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:700}
.marquee{display:inline-block;padding-left:100%;animation:marq 22s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font-family:var(--f-label);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--mute)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* network strips */
.strips{display:flex;flex-direction:column;gap:9px}
.strip{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:8px;font-family:var(--f-label);font-weight:700;font-size:13px}
.strip .code:last-child{text-align:right}
.track{position:relative;height:12px;border-radius:2px}
.track::before{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:var(--line)}
.track.ac::before{background:linear-gradient(90deg,var(--ac) 0 60%,transparent 60%) 0 0/8px 2px repeat-x;opacity:.7}
.track.dc::before{background:var(--dc);opacity:.55}
.track.none::before{background:var(--diesel);opacity:.45}
.pip{position:absolute;top:1px;width:14px;height:10px;margin-left:-7px;border-radius:3px;background:var(--amber);box-shadow:0 0 6px rgba(255,178,46,.5)}
.pip.down{background:var(--bad);box-shadow:none}
.strip.idle .code{color:var(--bad)}

/* log */
.log{display:flex;flex-direction:column;gap:0;font-size:14px}
.log div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.log div:last-child{border-bottom:0}
.log time{font-family:var(--f-label);color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}

/* route + unit cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
button.card:active{background:var(--panel-2)}
.rt-title{display:flex;align-items:baseline;gap:8px;font-family:var(--f-label);font-weight:700;font-size:18px;line-height:1.15;flex-wrap:wrap}
.rt-title .arrow{color:var(--mute);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.tag{font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.tag.dc{color:var(--dc)} .tag.ac{color:var(--ac)} .tag.none,.tag.diesel{color:var(--diesel)} .tag.dual{color:var(--ac)} .tag.bimode{color:var(--good)}
.tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)} .tag.good{color:var(--good)} .tag.plain{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .k{font-family:var(--f-label);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-family:var(--f-label);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:3px;background:var(--good)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}

.group-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-label);font-weight:700;font-size:16px;margin-top:4px}
.unit{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;text-align:left}
.unit .no{font-family:var(--f-board);font-weight:900;color:var(--amber);font-size:15px;white-space:nowrap}
.unit .where{font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .rel{font-family:var(--f-label);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.list{display:flex;flex-direction:column;gap:7px}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font-family:var(--f-label);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:var(--panel)}
.filters button.on{border-color:var(--amber);color:var(--amber)}

.cls-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cls-name{font-family:var(--f-label);font-weight:700;font-size:20px;line-height:1.1}
.cls-name small{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-top:2px}
.cls-no{font-family:var(--f-board);font-weight:900;color:var(--amber);font-size:22px;line-height:1;white-space:nowrap}
.blurb{font-size:14px;color:var(--mute);margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--f-label);font-weight:700;font-size:15px;padding:10px 14px;border-radius:10px;background:var(--amber);color:#1b1305;display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;line-height:1.15;flex:1 1 140px;text-align:left}
.btn small{font-weight:600;font-size:12.5px;opacity:.75}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.sm{flex:0 0 auto;padding:7px 11px;font-size:14px}
.stars{letter-spacing:1px;color:var(--amber);font-size:13px}

/* sheet + modal */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(3,5,8,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
  padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:4px;background:var(--line);border-radius:2px;align-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{width:36px;height:36px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;flex:none;font-size:18px;color:var(--mute)}
.overlay.center{align-items:center;padding:16px}
.modal{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.kicker{font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.modal h3{font-family:var(--f-label);font-size:24px;line-height:1.1}
.modal p{margin:0}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.choices .btn{flex:none;width:100%}
.report{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:15px}
.report div:nth-child(even){text-align:right;font-family:var(--f-label);font-weight:700;font-variant-numeric:tabular-nums}
.calls{font-size:13.5px;color:var(--mute);line-height:1.5}
input[type=range]{width:100%;accent-color:var(--amber);height:28px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.subhead{font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.02em}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.mini:first-child{border-top:0}
.mini .no{font-family:var(--f-board);font-weight:900;color:var(--amber)}

/* map */
.mapwrap{position:relative;height:calc(100vh - 290px);height:calc(100dvh - 290px);min-height:360px;max-height:760px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
.sea{fill:var(--sea)}
.land{fill:var(--land);stroke:var(--coast);stroke-width:.8px;vector-effect:non-scaling-stroke}
.land.far{fill:var(--land-far)}
.other{fill:none;stroke:#334050;stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.rl{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rl.dc{stroke:var(--dc)} .rl.ac{stroke:var(--ac)} .rl.none{stroke:var(--diesel)}
.rl.locked{stroke:var(--mute);stroke-dasharray:3 6;opacity:.7}
.rl.idle{stroke:var(--bad);stroke-dasharray:7 6}
.rl.halo{stroke:var(--bad);opacity:.32}
.rl.sel{stroke:var(--ink);opacity:.9}
.rl.wiring{stroke:var(--ac);stroke-dasharray:2 8;stroke-linecap:butt;filter:brightness(1.5)}
.hit{fill:none;stroke:transparent;stroke-width:24px;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer}
.st{fill:var(--ink);opacity:.7;pointer-events:none}
.term{fill:var(--bg);stroke:var(--ink);stroke-width:2px;vector-effect:non-scaling-stroke;pointer-events:none}
.st.off,.term.off{opacity:.35}
.lbl{fill:var(--ink);font-family:var(--f-label);font-weight:700;paint-order:stroke;stroke:var(--sea);stroke-linejoin:round;pointer-events:none}
.lbl-call{fill:var(--mute);font-weight:500;display:none}
#map.zoomed .lbl-call{display:inline}
.lbl.off{opacity:.55}
.tr{fill:var(--amber);stroke:#1b1305;stroke-width:1.4px;vector-effect:non-scaling-stroke;pointer-events:none;filter:drop-shadow(0 0 3px rgba(255,178,46,.7))}
.tr.down{fill:var(--bad);filter:none}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:42px;height:40px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-label);font-weight:700;font-size:15px;opacity:.94}
.maplegend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:5px 10px;max-width:calc(100% - 20px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:var(--f-label);font-size:12px;font-weight:600;color:var(--mute);opacity:.94;pointer-events:none}
.maplegend span{display:flex;align-items:center;gap:5px}
.maplegend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.maplegend i.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.linkbtn{font-family:var(--f-label);font-weight:600;font-size:13.5px;color:var(--amber)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
.tabs-in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:640px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--mute);border-radius:8px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--amber)}
.badge{font-size:10px;background:var(--bad);color:#fff;border-radius:8px;padding:0 5px;margin-left:2px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom, 0px));z-index:50;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.4)}

/* chooser */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.hero h1{font-family:var(--f-board);font-weight:900;color:var(--amber);font-size:38px;line-height:1;letter-spacing:.02em;text-shadow:0 0 10px rgba(255,178,46,.35)}
.hero p{margin:0;color:var(--mute);max-width:52ch}
.ops{display:flex;flex-direction:column;gap:8px}
.op{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.op.on{border-color:var(--amber)}
.op .code{font-family:var(--f-board);font-weight:900;color:var(--amber);font-size:16px}
.op b{font-family:var(--f-label);font-size:17px;display:block;line-height:1.15}
.op small{color:var(--mute);font-size:13px}
.diff{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.goal{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.goal:first-child{border-top:0}
.goal .tick{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;margin-top:1px}
.goal.done .tick{background:var(--good);border-color:var(--good);color:#06140c;font-weight:800}
.goal b{font-family:var(--f-label);font-size:16px}
.goal p{margin:0;font-size:13.5px;color:var(--mute)}
.prose p{margin:0 0 8px} .prose p:last-child{margin:0}
.prose ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
@media (min-width:560px){ .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:370px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .brow{grid-template-columns:44px minmax(0,1fr) 20px 74px;font-size:13px} }
@media (prefers-reduced-motion: reduce){ .marquee{animation:none;padding-left:0;white-space:normal} .calling{white-space:normal} }
</style>

<main id="main"></main>
<nav class="tabs" id="tabs" hidden><div class="tabs-in" id="tabs-in"></div></nav>
<div id="sheet"></div>
<div id="modal"></div>

const ACH = [

 ['first_new','Fresh off the line','Take delivery of a brand-new train.'],

/* ===================== SIM ===================== */
const DAY_MS = 5000, OP_HOURS = 18, START = Date.UTC(2027,3,1);
const SEASON = [.92,.95,1,1.02,1.03,1.04,1.06,1.08,1,1,.98,.95];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const dateOf=day=>new Date(START+day*864e5);

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return Date.UTC(y,mo-1,da)}
function isBankHol(d){
  const y=d.getUTCFullYear(),m=d.getUTCMonth(),dt=d.getUTCDate(),dow=d.getUTCDay(),t=d.getTime();
  if(m===0&&dt===1)return true;
  const e=easter(y); if(t===e-2*864e5||t===e+864e5)return true;
  if(dow===1){ if(m===4&&dt<=7)return true; if((m===4||m===7)&&dt+7>31)return true; }
  return false;
}
function dowMult(kind,dow){
  if(kind==='commuter') return dow===6?.78:dow===0?.62:1;
  if(kind==='leisure') return dow===6?1.25:dow===0?1.12:.92;
  if(kind==='intercity') return dow===5?1.12:dow===6?.88:dow===0?1.0:1;
  return dow===6?.88:dow===0?.75:1;
}
function baseFare(r){
  const f = r.kind==='intercity'?5+.2*r.mi : r.kind==='leisure'?3+.2*r.mi : r.kind==='regional'?2+.14*r.mi : 2+.16*r.mi;
  return f*(r.fareBoost||1);
}
function compat(trac,elec){
  if(trac==='diesel'||trac==='bimode')return true;
  if(elec==='none')return false;
  if(trac==='dual')return true;
  return trac===elec;
}
function tripH(c,r){return r.mi/(Math.min(c.mph,r.mph)*.62)+.4}
function tripsPerDay(c,r){return clamp(Math.floor(OP_HOURS/tripH(c,r)),1,36)}
const unitName=u=>u.cls+' '+String(u.n).padStart(3,'0');
const ageOf=(s,u)=>Math.max(0,dateOf(s.day).getUTCFullYear()-u.built);
const routeOf=(s,id)=>s.routes.find(r=>r.id===id);

function addUnit(s,cls,o){
  const c=C[cls]; s.nums[cls]=(s.nums[cls]||0)+1;
  const n = c.id==='43'? 2*s.nums[cls] : c.id==='91'? 100+s.nums[cls] : s.nums[cls];
  const built=o.built??c.year;
  const age=Math.max(0,2027+Math.floor(s.day/364)-built);
  const rel=o.fresh? c.rel : clamp(c.rel-age*.0022+rnd(-.02,.01),.68,.97);
  const u={id:'u'+(s.uid++),cls,n,built,rel,cb:0,route:o.route||null,st:o.st||(o.route?'active':'depot'),days:o.days||0,miles:0};
  s.units.push(u); if(cls==='142')s.flags.hadPacer=true; return u;
}
function routeUnits(s,r,all){return s.units.filter(u=>u.route===r.id&&(all?u.st!=='order':u.st==='active'))}

function newGame(opId){
  const op=OPS[opId];
  const s={v:1,op:opId,day:0,cash:op.cash*1e6,units:[],routes:[],mods:[],projects:[],news:[],strikes:0,periods:0,ach:{},flags:{},nums:{},uid:1,hist:[],last:null,over:null,cd:{},reports:[],period:freshPeriod(),best:{cash:op.cash*1e6,ppm:0}};
  op.routes.forEach(rd=>s.routes.push(Object.assign({},rd,{calls:rd.calls.slice(),open:true,fare:1,sat:70,ppm:92,t:null})));
  op.exp.forEach(rd=>s.routes.push(Object.assign({},rd,{calls:rd.calls.slice(),open:false,fare:1,sat:70,ppm:92,t:null})));
  op.fleet.forEach(([rid,cls,n])=>{for(let i=0;i<n;i++)addUnit(s,cls,{route:rid,built:C[cls].year+rint(0,3)})});
  let est=0,run=0;
  s.routes.forEach(r=>{
    if(r.locked)return;
    let seats=0,cap=0; routeUnits(s,r).forEach(u=>{const c=C[u.cls],t=tripsPerDay(c,r);seats+=t*c.seats;cap+=t*c.seats*c.stand;run+=t*r.mi*c.cost*(c.trac==='bimode'&&r.elec!=='none'?.75:1)+c.cars*700});
    r.demand=Math.round(seats*r.load/100)*100;
    est+=Math.min(r.demand,cap)*baseFare(r);
  });
  s.overhead=Math.round(Math.max(est*.2,est*(1-op.ok)-run)/1000)*1000;
  news(s,`You've taken over ${op.name}. The DfT expects ${op.target}% PPM.`,'');
  return s;
}
function freshPeriod(){return {rev:0,cost:0,ppm:0,sat:0,n:0,pax:0,repay:0}}
function news(s,text,tone){s.news.unshift({day:s.day,text,tone:tone||''});if(s.news.length>40)s.news.length=40}
function addMod(s,m){s.mods.push(m)}
function modMul(s,kind,r){let v=1;for(const m of s.mods)if(m.kind===kind&&hit(m,r))v*=m.v;return v}
function modSum(s,kind,r){let v=0;for(const m of s.mods)if(m.kind===kind&&hit(m,r))v+=m.v;return v}
function hit(m,r){return m.route==='*'||m.route===r.id||(m.route==='dc'&&r.elec==='dc')}
function dayRev(s){const h=s.hist.slice(-7);return h.length?Math.max(1.5e5,h.reduce((a,b)=>a+b.rev,0)/h.length):3e5}

let EMIT = { modal(){}, toast(){} }; // UI hooks

function simDay(s){
  const d=dateOf(s.day),m=d.getUTCMonth(),dt=d.getUTCDate(),dow=d.getUTCDay();
  const op=OPS[s.op],yrs=s.day/364;
  // deliveries, repairs, projects
  for(const u of s.units){
    if(u.st==='order'){ if(--u.days<=0){u.st=u.route?'active':'depot';news(s,`New ${C[u.cls].builder.split(' /')[0]} unit ${unitName(u)} delivered${u.route?' and in service':' to the depot'}.`,'good');unlock(s,'first_new')} }
    else if(u.st==='repair'||u.st==='refurb'){ if(--u.days<=0){ if(u.st==='refurb')news(s,`${unitName(u)} is back from refurbishment, smelling of new carpet.`,'good'); u.st=u.route?'active':'depot'; } }
  }
  for(const p of s.projects){ if(--p.days<=0){const r=routeOf(s,p.route);r.elec='ac';news(s,`Wires energised: ${r.from} – ${r.to} is now 25 kV electrified.`,'good');unlock(s,'electrify')} }
  s.projects=s.projects.filter(p=>p.days>0);
  seasonal(s,d);
  if(!s.over&&chance(.1))randomEvent(s,d);

  const xmas=m===11&&dt===25, boxing=m===11&&dt===26, bh=isBankHol(d);
  let rev=0,cost=0,pax=0,pw=0,ps=0,sw=0,ss=0;
  for(const r of s.routes){
    if(!r.open)continue;
    const act=routeUnits(s,r);
    let seatCap=0,cap=0,cw=0,relS=0,rc=0;
    for(const u of act){const c=C[u.cls],t=tripsPerDay(c,r);seatCap+=t*c.seats;cap+=t*c.seats*c.stand;cw+=(c.comfort+u.cb)*t*c.seats;relS+=u.rel;
      if(!xmas){const mi=t*r.mi;u.miles+=mi;rc+=mi*c.cost*(c.trac==='bimode'&&r.elec!=='none'?.75:1)}}
    for(const u of routeUnits(s,r,true))rc+=C[u.cls].cars*700;
    const comfort=seatCap?cw/seatCap:0;
    let dem=r.demand*(1+.02*yrs)*SEASON[m]*dowMult(r.kind,dow)*Math.pow(r.fare,-1.15)*(.7+.6*r.sat/100)*(.8+.3*Math.min(1,seatCap/r.demand))*modMul(s,'demand',r);
    if(bh)dem*=r.kind==='commuter'?.55:r.kind==='leisure'?1.4:1.05;
    if(boxing)dem*=.3;
    if(s.projects.some(p=>p.route===r.id))dem*=.9;
    if(xmas)dem=0;
    const carried=Math.min(dem,cap), load=seatCap?dem/seatCap:0;
    const rr=carried*baseFare(r)*r.fare*modMul(s,'revenue',r);
    let fails=0;
    if(!xmas)for(const u of act){
      if(chance((1-u.rel)*.045)){u.st='repair';u.days=rint(2,6);fails++;rc+=rint(60,220)*1000;
        news(s,pick([`${unitName(u)} failed near ${pick(r.calls)}. Passengers decanted.`,`Door fault on ${unitName(u)} at ${pick(r.calls)}.`,`${unitName(u)} lost traction power near ${pick(r.calls)}.`,`${unitName(u)} taken out of service at ${pick(r.calls)} with a brake fault.`]),'bad')}
      u.rel=Math.max(.55,u.rel-.00006);
    }
    let ppm;
    if(!act.length)ppm=0;
    else if(xmas)ppm=r.ppm;
    else ppm=clamp(97-(1-relS/act.length)*40-Math.max(0,load-1)*15-Math.min(35,fails*25/act.length)+modSum(s,'ppm',r)+rnd(-2,1.2),25,99.6);
    const target=!act.length?5:15+.5*ppm+5*comfort-Math.max(0,load-.95)*90-Math.max(0,r.fare-1)*45+Math.max(0,1-r.fare)*20+modSum(s,'sat',r);
    if(!xmas)r.sat+=(clamp(target,0,100)-r.sat)*.06;
    r.ppm=ppm;
    r.t={dem,carried,seatCap,cap,load,ppm,rev:rr,cost:rc,units:act.length,comfort,fails};
    rev+=rr;cost+=rc;pax+=carried;
    const w=act.length?Math.max(carried,1):r.demand*.25; pw+=w; ps+=ppm*w;
    const w2=Math.max(carried,r.demand*.1); sw+=w2; ss+=r.sat*w2;
  }
  for(const u of s.units)if(!u.route&&u.st!=='order')cost+=C[u.cls].cars*700;
  cost+=s.overhead*(xmas?.4:1);
  const dppm=pw?ps/pw:90, dsat=sw?ss/sw:60;
  const repay=xmas?0:rev*Math.max(0,92-dppm)*.006; cost+=repay;
  const profit=rev-cost; s.cash+=profit;
  s.last={rev,cost,profit,pax,ppm:dppm,sat:dsat,repay};
  s.hist.push({rev,profit,ppm:dppm}); if(s.hist.length>56)s.hist.shift();
  const P=s.period; P.rev+=rev;P.cost+=cost;P.ppm+=dppm;P.sat+=dsat;P.n++;P.pax+=pax;P.repay+=repay;
  for(const md of s.mods)md.days--; s.mods=s.mods.filter(md=>md.days>0);
  s.day++;
  if(dsat>=85)unlock(s,'sat85');
  if(s.cash>=100e6)unlock(s,'cash100');
  if(s.cash>s.best.cash)s.best.cash=s.cash;
  if(s.day%28===0)periodEnd(s);
  if(!s.over&&s.cash<-25e6){s.over='bust';EMIT.modal(gameOverModal(s))}
}

function periodEnd(s){
  const P=s.period,op=OPS[s.op],ppm=P.ppm/P.n,sat=P.sat/P.n;
  const pay=(ppm-op.target)*P.rev*.008; s.cash+=pay;
  const bad=ppm<op.target-6||sat<50||s.cash<0, good=ppm>=op.target&&sat>=62;
  const before=s.strikes;
  if(bad)s.strikes++; else if(good&&s.strikes>0)s.strikes--;
  s.periods++;
  const pno=((s.periods-1)%13)+1, yr=2027+Math.floor((s.periods-1)/13);
  const rep={pno,yr,ppm,sat,rev:P.rev,cost:P.cost,profit:P.rev-P.cost+pay,pay,pax:P.pax,repay:P.repay,bad,good,strikes:s.strikes,before,target:op.target};
  s.reports.unshift(rep); if(s.reports.length>13)s.reports.length=13;
  if(ppm>s.best.ppm)s.best.ppm=ppm;
  if(ppm>=95)unlock(s,'ppm95');
  if(s.periods>=13)unlock(s,'year1');
  s.period=freshPeriod();
  news(s,`Period ${pno} closed: PPM ${ppm.toFixed(1)}%, satisfaction ${Math.round(sat)}%.`,bad?'bad':good?'good':'');
  if(s.strikes>=3){s.over='dft';EMIT.modal(gameOverModal(s))}
  else EMIT.modal(reportModal(s,rep));
}

function unlock(s,id){if(s.ach[id])return;s.ach[id]=s.day+1;const a=ACH.find(x=>x[0]===id);news(s,`Goal complete: ${a[1]}.`,'good');EMIT.toast(`Goal complete: ${a[1]}`)}
function checkAch(s){
  if(s.units.filter(u=>u.st!=='order').length>=40)unlock(s,'fleet40');
  if(s.flags.hadPacer&&!s.units.some(u=>u.cls==='142'))unlock(s,'no_pacer');
}

function spend(s,x){s.cash-=x}
function openRoutes(s){return s.routes.filter(r=>r.open)}
function busiest(s){return openRoutes(s).slice().sort((a,b)=>b.demand-a.demand)[0]}

function seasonal(s,d){
  const m=d.getUTCMonth(),dt=d.getUTCDate(),op=OPS[s.op];
  const f=op.festival;
  if(m===f.m&&dt===f.d){const r=routeOf(s,f.route); if(r&&r.open){addMod(s,{kind:'demand',route:r.id,v:f.mult,days:f.days});news(s,`${f.name}: demand on ${r.from} – ${r.to} is through the roof. Add capacity if you can.`,'')}}
  if(m===9&&dt===1){
    const c=dayRev(s)*1.1;
    EMIT.modal({kicker:'Autumn',title:'Leaf-fall season starts today',body:`<p>Crushed leaves on the railhead turn into a Teflon-like paste. Trains slide, brake early and run late until the end of November.</p><p>Network Rail can run extra Railhead Treatment Trains on your routes, at your cost.</p>`,
      choices:[{label:'Pay for extra treatment',sub:money(c),fn:()=>{spend(s,c);addMod(s,{kind:'ppm',route:'*',v:-1.5,days:61});news(s,'Extra Railhead Treatment Trains booked for autumn.','good')}},
               {label:'Take our chances',sub:'Expect a hit to PPM',fn:()=>{addMod(s,{kind:'ppm',route:'*',v:-6,days:61});news(s,'Leaves on the line. Again.','bad')}}]});
  }
  if(m===11&&dt===25)news(s,'Christmas Day. No trains run anywhere in Britain. Merry Christmas.','');
  if(m===11&&dt===27){const r=busiest(s);addMod(s,{kind:'demand',route:r.id,v:.75,days:5});addMod(s,{kind:'ppm',route:r.id,v:-5,days:5});news(s,`Christmas engineering works close part of ${r.from} – ${r.to}. Rail replacement buses deployed.`,'bad')}
  if(isBankHol(d))news(s,'Bank holiday: commuters vanish, day-trippers appear.','');
}

function randomEvent(s,d){
  const pool=EVENTS.filter(e=>(!e.can||e.can(s,d))&&!(s.cd[e.id]>s.day));
  let tot=pool.reduce((a,e)=>a+e.w,0),x=Math.random()*tot;
  for(const e of pool){x-=e.w;if(x<=0){s.cd[e.id]=s.day+e.cd;const m=e.run(s);if(m)EMIT.modal(m);return}}
}

/* ===================== FORMAT ===================== */
function money(x){const a=Math.abs(x),sg=x<0?'−':'';if(a>=1e6)return sg+'£'+(a/1e6).toFixed(a>=1e8?0:1)+'m';if(a>=1e3)return sg+'£'+Math.round(a/1e3)+'k';return sg+'£'+Math.round(a)}
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(day){const d=dateOf(day);return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`}
function periodLabel(day){const p=Math.floor(day/28),pno=(p%13)+1,y=2027+Math.floor(p/13);return `P${pno} ${y}/${String((y+1)%100).padStart(2,'0')} · wk ${Math.floor((day%28)/7)+1}`}
const hhmm=min=>{min=((Math.round(min)%1440)+1440)%1440;return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0')}
const ELEC={dc:'Third rail DC',ac:'25 kV AC',none:'Diesel only'};
const TRAC={dc:'Third rail',ac:'25 kV',dual:'Dual voltage',diesel:'Diesel',bimode:'Bi-mode'};
function stars(c){const f=Math.round(c);return `<span class="stars" aria-label="Comfort ${f} of 5">${'★'.repeat(f)}${'☆'.repeat(5-f)}</span>`}
function grade(s){if(!s||!s.last)return 'B';const op=OPS[s.op];const P=s.period;const ppm=P.n?P.ppm/P.n:s.last.ppm,sat=P.n?P.sat/P.n:s.last.sat;const sc=50+(ppm-op.target)*4+(sat-65);return sc>=78?'A':sc>=60?'B':sc>=42?'C':sc>=25?'D':'E'}
function tone(v,good,ok){return v>=good?'good':v>=ok?'warn':'bad'}

function save(){try{if(S)localStorage.setItem(SAVE_KEY,JSON.stringify(S));else localStorage.removeItem(SAVE_KEY)}catch(e){}}
function load(){try{const t=localStorage.getItem(SAVE_KEY);if(t){const s=JSON.parse(t);if(s&&s.v===1&&OPS[s.op])return s}}catch(e){}return null}

function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(ui.toastT);ui.toastT=setTimeout(()=>el.hidden=true,2600)}

function updateHQ(){
  const op=OPS[S.op],P=S.period,l=S.last;
  const ppm=P.n?P.ppm/P.n:(l?l.ppm:null), sat=P.n?P.sat/P.n:(l?l.sat:null);
  const pprof=P.rev-P.cost;
  $('#kpis').innerHTML=`
   <div class="kpi"><span class="k">PPM this period</span><span class="v ${ppm==null?'':tone(ppm,op.target,op.target-6)}">${ppm==null?'—':ppm.toFixed(1)+'%'}</span><span class="s">Target ${op.target}%</span></div>
   <div class="kpi"><span class="k">Satisfaction</span><span class="v ${sat==null?'':tone(sat,70,50)}">${sat==null?'—':Math.round(sat)+'%'}</span><span class="s">Below 50% earns a warning</span></div>
   <div class="kpi"><span class="k">Yesterday</span><span class="v ${l&&l.profit<0?'bad':''}">${l?money(l.profit):'—'}</span><span class="s">${l?Math.round(l.pax).toLocaleString('en-GB')+' passengers':'Day one'}</span></div>
   <div class="kpi"><span class="k">Period profit</span><span class="v ${pprof<0?'bad':''}">${P.n?money(pprof):'—'}</span><span class="s">${28-(S.day%28)} days to DfT review</span></div>`;
  $('#strips').innerHTML=openRoutes(S).map(r=>{
    const us=routeUnits(S,r,true);
    const act=us.filter(u=>u.st==='active'),down=us.filter(u=>u.st!=='active');
    const tt=act.length?tripH(C[act[0].cls],r):1;
    return `<button class="strip ${act.length?'':'idle'}" data-a="route" data-v="${r.id}" aria-label="${r.from} to ${r.to}, ${act.length} units"><span class="code">${r.fc}</span><span class="track ${r.elec}">${act.map((u,i)=>`<i class="pip" data-tt="${tripH(C[u.cls],r)}" data-o="${i/act.length*2}"></i>`).join('')}${down.map(u=>`<i class="pip down" style="left:${15+hash(u.id)%70}%"></i>`).join('')}</span><span class="code">${r.tc}</span></button>`}).join('');
  ui.pips=[...document.querySelectorAll('#strips .pip:not(.down)')];
  $('#log').innerHTML=S.news.slice(0,10).map(n=>{const d=dateOf(n.day);return `<div><time>${d.getUTCDate()} ${MON[d.getUTCMonth()]}</time><span class="${n.tone}">${n.text}</span></div>`}).join('');
  ui.boardT=0; updateBoard();
}
function boardRows(){
  const clock=300+ui.frac*1140;const rows=[];
  for(const r of openRoutes(S)){
    const act=routeUnits(S,r);if(!act.length)continue;
    const trips=act.reduce((a,u)=>a+tripsPerDay(C[u.cls],r),0);
    const hw=Math.max(4,Math.floor(1140/Math.max(1,trips/2)));
    const first=300+hash(r.id)%hw;
    const k=Math.max(0,Math.ceil((clock-first)/hw));
    for(let j=0;j<3;j++){const t=first+(k+j)*hw;if(t<1440)rows.push({t,r})}
  }
  rows.sort((a,b)=>a.t-b.t);
  return rows.slice(0,5).map(({t,r})=>{
    const h=hash(r.id+'|'+S.day+'|'+t)%1000/10, p=r.ppm||90;
    const st=h<p?'On time':h<p+(100-p)*.85?'Exp '+hhmm(t+3+hash(r.id+t)%22):'Cancelled';
    return {t,r,st,plat:1+hash(r.id)%OPS[S.op].plats};
  });
}
function updateBoard(){
  const el=$('#brows');if(!el)return;
  $('#bclock').textContent=hhmm(300+ui.frac*1140);
  const rows=boardRows();
  el.innerHTML=rows.length?rows.map(x=>`<div class="brow"><span>${hhmm(x.t)}</span><span>${x.r.to}</span><span>${x.plat}</span><span class="st">${x.st}</span></div>`).join(''):`<div class="brow empty">${ui.frac>.98?'Services have finished for today':'No trains in service. Assign some in Routes.'}</div>`;
  const first=rows[0];const txt=first?`Calling at: ${first.r.calls.join(', ')}${first.r.calls[0]==='Non-stop'?'':' and '+first.r.to}.  ${first.r.label||''}`:'Please listen for announcements.';
  if(txt!==ui.lastCall){ui.lastCall=txt;$('#bcall').textContent=txt}
}

/* ---------- Map ---------- */
const polyCache={};
function defOf(opId,rid){const o=OPS[opId];return [...o.routes,...o.exp].find(r=>r.id===rid)}
function routePoly(opId,rid){
  const k=opId+':'+rid;if(polyCache[k])return polyCache[k];
  const d=defOf(opId,rid);const pts=(d?d.geo:[]).map(n=>GEO.st[n]).filter(Boolean);
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  return polyCache[k]={pts,cum,len:cum[cum.length-1]||1,d:pts.length?'M'+pts.map(p=>p[0]+' '+p[1]).join('L'):''};
}
function pointAt(P,f){
  const d=clamp(f,0,1)*P.len;let i=1;while(i<P.cum.length-1&&P.cum[i]<d)i++;
  const a=P.pts[i-1],b=P.pts[i]||a,seg=(P.cum[i]-P.cum[i-1])||1,t=(d-P.cum[i-1])/seg;
  return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
}
function bounds(polys){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const P of polys)for(const [x,y] of P.pts){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}return [x0,y0,x1,y1]}
function mapSize(){const el=$('#map');return el?[el.clientWidth||360,el.clientHeight||480]:[360,480]}
function fitTo(b,pad){
  const [cw,ch]=mapSize();let [x0,y0,x1,y1]=b;
  const L=24+pad,Rt=64+pad,T=28+pad,B=58+pad;
  const bw=Math.max(20,x1-x0),bh=Math.max(20,y1-y0);
  const s=Math.max(bw/Math.max(80,cw-L-Rt),bh/Math.max(80,ch-T-B));
  const sx=(cw-L-Rt)*s-bw,sy=(ch-T-B)*s-bh;
  ui.vb={x:x0-L*s-sx/2,y:y0-T*s-sy/2,w:cw*s,h:ch*s};
}
function fitNetwork(){const ps=S.routes.filter(r=>r.open).map(r=>routePoly(S.op,r.id));fitTo(bounds(ps),10)}
function fitGB(){fitTo([150,20,780,1120],0)}
function applyVB(){
  const svg=$('#map');if(!svg||!ui.vb)return;const [cw,ch]=mapSize();
  ui.vb.h=ui.vb.w*ch/cw;const v=ui.vb;svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);
  const s=v.w/cw;if(Math.abs(s-(ui.mapS||0))>1e-6){ui.mapS=s;scaleMap()}else{clearTimeout(ui.lblT);ui.lblT=setTimeout(placeLabels,60)}
}
function scaleMap(){
  const s=ui.mapS,svg=$('#map');if(!svg)return;
  svg.classList.toggle('zoomed',s<.32);
  svg.querySelectorAll('.st').forEach(e=>e.setAttribute('r',2.2*s));
  svg.querySelectorAll('.term').forEach(e=>e.setAttribute('r',4.5*s));
  svg.querySelectorAll('.tr').forEach(e=>e.setAttribute('r',4.6*s));
  svg.querySelectorAll('.lbl').forEach(e=>{const big=e.classList.contains('lbl-term');e.setAttribute('font-size',(big?12.5:10.5)*s);e.setAttribute('stroke-width',3.2*s)});
  placeLabels();

function placeLabels(){

  const inView=b=>b[0]>v.x+4*s&&b[2]<v.x+v.w-4*s&&b[1]>v.y+4*s&&b[3]<v.y+v.h-4*s;
  const rank=e=>(e.classList.contains('lbl-term')?0:2)+(e.classList.contains('off')?1:0);
  const els=[...svg.querySelectorAll('.lbl')].sort((a,b)=>rank(a)-rank(b));

    const fs=(call?10.5:12.5)*s,w=e.textContent.length*fs*.53,x=+e.dataset.x,y=+e.dataset.y,g=7*s;
    const opts=[[x+g,y+fs*.35,'start'],[x-g,y+fs*.35,'end'],[x-w/2,y-g,'start'],[x-w/2,y+g+fs*.8,'start'],[x-g*.4,y-g,'start'],[x-g*.4,y+g+fs*.8,'start'],[x+g*.4-w,y-g,'start'],[x+g*.4-w,y+g+fs*.8,'start']];
    let ok=null;
    for(const [lx,ly,a] of opts){const bx=a==='end'?lx-w:lx,box=[bx,ly-fs*.85,bx+w,ly+fs*.25];
      if(inView(box)&&!placed.some(p=>box[0]<p[2]&&box[2]>p[0]&&box[1]<p[3]&&box[3]>p[1])){ok=[lx,ly,a,box];break}}

function updateMap(){

    const proj=S.projects.some(p=>p.route===r.id);

    if(r.id===sel)rh+=`<path class="rl sel" d="${P.d}" style="stroke-width:${w+5}px"/>`;
    if(r.open&&act&&load>1.05)rh+=`<path class="rl halo" d="${P.d}" style="stroke-width:${w+(load>1.2?9:6)}px"/>`;
    const cls=!r.open?'locked':!act?'idle':r.elec;
    rh+=`<path class="rl ${cls}" d="${P.d}" style="stroke-width:${w}px"/>`;
    if(proj)rh+=`<path class="rl wiring" d="${P.d}" style="stroke-width:${w}px"/>`;
    rh+=`<path class="hit" d="${P.d}" data-mr="${r.id}"/>`;

    lh+=`<text class="lbl ${o.t?'lbl-term':'lbl-call'}${o.open?'':' off'}" data-x="${x}" data-y="${y}" x="${x}" y="${y}">${n}</text>`}

function bindMap(){
  const svg=$('#map');if(!svg)return;
  const pts=new Map();let moved=0,last=null;
  const rel=e=>{const b=svg.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,rel(e));if(pts.size===1)moved=0;last=null});
  svg.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;const p=rel(e),prev=pts.get(e.pointerId);pts.set(e.pointerId,p);
    if(pts.size===1){const dx=p[0]-prev[0],dy=p[1]-prev[1];moved+=Math.abs(dx)+Math.abs(dy);const s=ui.vb.w/mapSize()[0];ui.vb.x-=dx*s;ui.vb.y-=dy*s;applyVB()}
    else if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;moved+=99;
      if(last){const s=ui.vb.w/mapSize()[0];ui.vb.x-=(mx-last.mx)*s;ui.vb.y-=(my-last.my)*s;zoomAt(d/last.d,mx,my)}last={d,mx,my}}
  });
  const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);last=null;
    if(e.type==='pointerup'&&pts.size===0&&moved<8){
      const hit=[...document.elementsFromPoint(e.clientX,e.clientY)].find(x=>x.dataset&&x.dataset.mr);
      ui.mapSel=hit?hit.dataset.mr:null;updateMap();
    }};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  svg.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=rel(e);zoomAt(e.deltaY<0?1.2:1/1.2,x,y)},{passive:false});
}

 electrify:v=>{const r=routeOf(S,v);const c=Math.round(r.mi*.45*10)/10*1e6;if(S.cash<c)return;S.cash-=c;S.projects.push({route:v,days:Math.round(60+r.mi*.8)});ui.confirm=null;news(S,`Electrification of ${r.from} – ${r.to} begins. Masts going up.`,'');save();renderAll()},

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset.v,el,e)});

const up=()=>{ui.ptr=false;if(ui.dirty)setTimeout(()=>{if(!ui.ptr&&ui.dirty)tickRender()},250)};
document.addEventListener('pointerup',up,true);document.addEventListener('pointercancel',up,true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)A.close()});

/* ---------- loop ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function frame(ts){
  const dt=ui.last?Math.min(250,ts-ui.last):0;ui.last=ts;
  if(S&&!paused()){
    ui.acc+=dt*S.speed;
    if(ui.acc>=DAY_MS){ui.acc-=DAY_MS;if(ui.acc>DAY_MS)ui.acc=0;simDay(S);checkAch(S);save();tickRender()}
  }
  ui.frac=S?ui.acc/DAY_MS:0;
  const p=$('#dayprog');if(p)p.style.width=(ui.frac*100)+'%';
  if(S&&ui.tab==='hq'){
    ui.boardT+=dt;if(ui.boardT>500){ui.boardT=0;updateBoard()}
    if(ui.pips&&!reduce.matches){const hrs=ui.frac*19;for(const el of ui.pips){const tt=+el.dataset.tt,ph=((hrs/tt)+(+el.dataset.o))%2;el.style.left=((ph<1?ph:2-ph)*96+2)+'%'}}
    else if(ui.pips){for(const el of ui.pips){el.style.left=(+el.dataset.o/2*96+2)+'%'}}
  }
  if(S&&ui.tab==='map'&&!paused())moveTrains();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ui.last=0;if(document.hidden)save()});

/* ---------- boot ---------- */
function start(data){
  S=(data&&data.S)||load();
  if(data&&data.ui)Object.assign(ui,{tab:data.ui.tab||'hq'});
  ui.frac=0;renderAll();requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>({S,ui:{tab:ui.tab}}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
